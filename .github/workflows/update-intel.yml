name: Update Intelligence Feeds

on:
  repository_dispatch:
    types: [update-intel]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and Write intelligence data
        env:
          PAYLOAD_CONTENT: ${{ toJson(github.event.client_payload.content) }}
        run: |
          FILENAME="${{ github.event.client_payload.filename }}"
          
          # Security validation to prevent path traversal
          if [ "$FILENAME" != "cyber-intel.json" ] && [ "$FILENAME" != "ai-intel.json" ]; then
            echo "Error: Invalid filename '$FILENAME'. Only 'cyber-intel.json' and 'ai-intel.json' are allowed."
            exit 1
          fi
          
          # Write the payload JSON content to the public folder safely using env var
          echo "$PAYLOAD_CONTENT" > public/$FILENAME

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/${{ github.event.client_payload.filename }}
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-update ${{ github.event.client_payload.filename }} from Activepieces"
            git push
          fi
