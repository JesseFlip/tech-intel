[project]
name = "intel-pipeline"
version = "0.1.0"
description = "Unified AI, Cyber, and Finance Intelligence Pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=0.3.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "structlog>=24.0.0",
    "pyyaml>=6.0.1",
    "OTXv2>=1.5.12",
    "anthropic>=0.42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intel_pipeline"]

[tool.uv]
managed = true
